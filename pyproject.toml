[project]
name = "archivecired"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[tool.pytest.ini_options]
markers = [
    "integration: spawns subprocesses or uses sleep-based timing",
    "slow: requires network access or real data",
    "adherence: code quality checks",
]

[dependency-groups]
dev = ["ruff>=0.9", "pytest>=8"]
